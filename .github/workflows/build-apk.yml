name: Build Veliora APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. JDK 21
      # --------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # --------------------------------------------------
      # 3. Android SDK
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # --------------------------------------------------
      # 4. Install Android SDK components required by
      #    Veliora
      # --------------------------------------------------
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      # --------------------------------------------------
      # 5. Verify Java / Android environment
      # --------------------------------------------------
      - name: Verify build environment
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          echo "========================================"
          echo "Java"
          echo "========================================"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

          echo
          echo "========================================"
          echo "Android SDK"
          echo "========================================"
          echo "ANDROID_HOME=$ANDROID_HOME"

          sdkmanager --version

          echo
          echo "========================================"
          echo "SDK packages"
          echo "========================================"
          sdkmanager --list_installed | grep -E \
            "platforms;android-35|build-tools;35.0.0|platform-tools" \
            || true

      # --------------------------------------------------
      # 6. Prepare environment expected by Veliora's
      #    build-apk.sh
      # --------------------------------------------------
      - name: Prepare Veliora build environment
        run: |
          echo "Preparing environment..."

          # Veliora's script expects ANDROID_HOME
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          # Make Java explicitly available
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

          java -version
          adb version
          sdkmanager --version

      # --------------------------------------------------
      # 7. Make build script executable
      # --------------------------------------------------
      - name: Make build script executable
        run: |
          chmod +x scripts/build-apk.sh

      # --------------------------------------------------
      # 8. Build APK
      # --------------------------------------------------
      - name: Build APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "========================================"
          echo "Starting Veliora APK build"
          echo "========================================"

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

          java -version

          ./scripts/build-apk.sh

      # --------------------------------------------------
      # 9. Show generated APK
      # --------------------------------------------------
      - name: Find APK
        run: |
          echo "========================================"
          echo "Generated APK files"
          echo "========================================"

          find android -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      # --------------------------------------------------
      # 10. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veliora-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
